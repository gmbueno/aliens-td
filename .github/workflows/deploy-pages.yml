name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate campaign and game rules
        run: npm test

      - name: Install browser test dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Select a headless browser
        timeout-minutes: 5
        run: |
          game_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$game_browser_path" ]; then
            echo "GAME_BROWSER_EXECUTABLE=$game_browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Validate target and upgrade controls in a browser
        env:
          GAME_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 > /tmp/aliens-browser-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "$GAME_URL" > /dev/null
          npm run test:controls

      - name: Validate recorded audio and shotgun gameplay
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:audio

      - name: Validate arsenal, powers and new enemy behaviors
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:arsenal

      - name: Save browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            output/ui-refresh/controls
            output/audio-shotgun
            output/arsenal

      - name: Prepare production files
        run: |
          mkdir _site
          cp index.html styles.css favicon.ico _site/
          cp -R src assets _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
