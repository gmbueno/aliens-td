name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate campaign and game rules
        run: npm test

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate target and upgrade controls in a browser
        env:
          GAME_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 > /tmp/aliens-browser-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "$GAME_URL" > /dev/null
          npm run test:controls

      - name: Save interaction test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-test-screenshots
          path: output/ui-refresh/controls

      - name: Prepare production files
        run: |
          mkdir _site
          cp index.html styles.css favicon.ico _site/
          cp -R src assets _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
