name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate campaign and game rules
        run: npm test

      - name: Install browser test dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Select a headless browser
        timeout-minutes: 5
        run: |
          game_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$game_browser_path" ]; then
            echo "GAME_BROWSER_EXECUTABLE=$game_browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Validate target and upgrade controls in a browser
        env:
          GAME_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 > /tmp/aliens-browser-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "$GAME_URL" > /dev/null
          npm run test:controls

      - name: Validate recorded audio and shotgun gameplay
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:audio

      - name: Validate category loadouts and powers
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:arsenal

      - name: Validate terrain art and paid Suppression
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:pads

      - name: Validate quiet battlefield and actual per-unit damage contribution
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:contribution

      - name: Validate stable command UI, mixed progression and preparation mines
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:refinement

      - name: Validate mobile layout, real touch navigation and first-run guidance
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:mobile

      - name: Validate tactical economy, specialists and enemy control
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:tactics

      - name: Validate endless defense, directional fire and illustrated command UI
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:expansion

      - name: Validate dual powers and integrated equipment deck
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:support

      - name: Validate command graph, purchases and field support
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:progression

      - name: Validate tactical HUD and responsive controls
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:hud

      - name: Validate energy weapons and frontier art
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:frontier

      - name: Validate pointer preview and placement on every mission
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:placement

      - name: Validate three-mission onboarding and persistence through the UI
        env:
          GAME_URL: http://127.0.0.1:4173
        run: npm run test:browser

      - name: Prepare production files
        run: npm run build

      - name: Validate packaged release
        env:
          GAME_URL: http://127.0.0.1:4174
        run: |
          python3 -m http.server 4174 --directory _site > /tmp/aliens-release-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "$GAME_URL" > /dev/null
          npm run test:build

      - name: Save browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            output/ui-refresh/controls
            output/audio-shotgun
            output/arsenal
            output/doctrine
            output/hud
            output/frontier
            output/placement
            output/browser
            output/refinement
            output/mobile
            output/contribution

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for uploaded site availability
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$count" -gt 0 ]; then exit 0; fi
            fi
            sleep 2
          done
          echo "The uploaded site is not yet visible to the deployment API."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
